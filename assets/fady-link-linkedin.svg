<svg xmlns="http://www.w3.org/2000/svg" width="257" height="94" viewBox="0 0 257 94" role="img" aria-labelledby="title desc">
<title id="title">LINKEDIN — quick access</title><desc id="desc">Dark mission-control quick-link card with LINKEDIN brand accent and an animated signal.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101630"/><stop offset="1" stop-color="#13102a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="255" height="92" rx="12" fill="url(#bg)" stroke="#353a61" stroke-width="1.3"/>\n<path d="M13 2H244" stroke="#0A66C2" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="64 210" opacity=".75"><animate attributeName="stroke-dashoffset" from="274" to="-274" dur="4.8s" repeatCount="indefinite"/></path>
<path d="M11 14H76" stroke="#0A66C2" stroke-width="2" opacity=".88"/><circle cx="13" cy="14" r="2.3" fill="#0A66C2"><animate attributeName="cx" values="13;74;13" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.95;.05" dur="4.4s" repeatCount="indefinite"/></circle>
<path d="M10 75H247" stroke="#31395d" stroke-width=".8"/>
<path d="M10 75H247" stroke="#0A66C2" stroke-width="1.8" stroke-dasharray="23 214" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-237" dur="6s" repeatCount="indefinite"/></path>
<circle cx="229" cy="15" r="3.6" fill="#0A66C2" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle>
<rect x="20" y="24" width="42" height="36" rx="7" fill="#0A66C2" stroke="#63b0ff" stroke-width="1.2"/><text x="41" y="49" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="900" fill="#fff" text-anchor="middle">in</text><circle cx="41" cy="42" r="21" fill="none" stroke="#88C6FF" stroke-width="1.8" opacity=".4"><animate attributeName="r" values="20;26;20" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="3s" repeatCount="indefinite"/></circle>
<g font-family="Arial,Helvetica,sans-serif"><text x="76" y="23" font-family="Consolas,monospace" font-size="8" letter-spacing="1.6" fill="#8090b9">QUICK LINK / 03</text><text x="76" y="46" font-size="19" font-weight="900" fill="#f0f1ff">LINKEDIN</text><text x="76" y="62" font-family="Consolas,monospace" font-size="10.2" fill="#0A66C2">LET'S CONNECT</text><text x="229" y="88" font-family="Consolas,monospace" text-anchor="end" font-size="8.7" fill="#93a0c2">OPEN &#8599;</text></g>
</svg>