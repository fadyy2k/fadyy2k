<svg xmlns="http://www.w3.org/2000/svg" width="257" height="94" viewBox="0 0 257 94" role="img" aria-labelledby="title desc">
<title id="title">CREDLY — quick access</title><desc id="desc">Dark mission-control quick-link card with CREDLY brand accent and an animated signal.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101630"/><stop offset="1" stop-color="#13102a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="255" height="92" rx="12" fill="url(#bg)" stroke="#353a61" stroke-width="1.3"/>
<path d="M11 14H76" stroke="#FF6B35" stroke-width="2" opacity=".88"/><circle cx="13" cy="14" r="2.3" fill="#FF6B35"><animate attributeName="cx" values="13;74;13" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.95;.05" dur="4.4s" repeatCount="indefinite"/></circle>
<path d="M10 75H247" stroke="#31395d" stroke-width=".8"/>
<path d="M10 75H247" stroke="#FF6B35" stroke-width="1.8" stroke-dasharray="23 214" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-237" dur="6s" repeatCount="indefinite"/></path>
<circle cx="229" cy="15" r="3.6" fill="#FF6B35" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="41" cy="38" r="18" fill="#2b1c27" stroke="#FF6B35" stroke-width="2"/><circle cx="41" cy="38" r="9" fill="none" stroke="#FF6B35" stroke-width="1.7"/><path d="M33 53l-6 13 14-6 14 6-6-13" fill="none" stroke="#FF6B35" stroke-width="1.8" stroke-linejoin="round"/><path d="m36 38 4 4 8-9" fill="none" stroke="#FF6B35" stroke-width="2"/><circle cx="41" cy="38" r="24" fill="none" stroke="#FF6B35" stroke-width="1.4" opacity=".35"><animate attributeName="r" values="20;27;20" dur="3.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.7s" repeatCount="indefinite"/></circle>
<g font-family="Arial,Helvetica,sans-serif"><text x="76" y="23" font-family="Consolas,monospace" font-size="8" letter-spacing="1.6" fill="#8090b9">QUICK LINK / 04</text><text x="76" y="46" font-size="19" font-weight="900" fill="#f0f1ff">CREDLY</text><text x="76" y="62" font-family="Consolas,monospace" font-size="10.2" fill="#FF6B35">VERIFIED SKILLS</text><text x="229" y="88" font-family="Consolas,monospace" text-anchor="end" font-size="8.7" fill="#93a0c2">OPEN &#8599;</text></g>
</svg>