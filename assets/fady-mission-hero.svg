<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="328" viewBox="0 0 1080 328" role="img" aria-labelledby="title desc">
<title id="title">Fady Zaghloul — engineering meets mission control</title>
<desc id="desc">Futuristic dark navy, violet, cyan and electric lime title banner with animated network orbit, terminal labels and personal signature.</desc>
<defs>
  <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0d1233"/><stop offset=".56" stop-color="#090d22"/><stop offset="1" stop-color="#11102b"/></linearGradient>
  <linearGradient id="type" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".45" stop-color="#ded7ff"/><stop offset="1" stop-color="#7ee8ff"/></linearGradient>
  <linearGradient id="neon" x2="1" y2="0"><stop stop-color="#ad6bff"/><stop offset=".5" stop-color="#32d7fb"/><stop offset="1" stop-color="#bbff72"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#8a4dff" stop-opacity=".35"/><stop offset="1" stop-color="#8a4dff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8097ff" stroke-width=".55" opacity=".13"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="328" rx="20" fill="url(#panel)"/>
<rect width="1080" height="328" rx="20" fill="url(#grid)"/>
<circle cx="836" cy="158" r="225" fill="url(#aura)"/>
<path d="M23 57H1056 M23 279H1056" stroke="#323b66" stroke-width="1"/>
<path d="M24 57H280 M800 279H1056" stroke="url(#neon)" stroke-width="2" opacity=".9"/>
<g fill="none" stroke-linecap="round">
 <path d="M728 161H945 M835 54V268" stroke="#6b58cd" stroke-width="1" opacity=".28" stroke-dasharray="4 9"/>
