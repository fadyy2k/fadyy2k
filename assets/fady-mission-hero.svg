 <circle cx="834" cy="160" r="77" stroke="url(#neon)" opacity=".8" stroke-width="2" stroke-dasharray="140 18 48 26">
   <animateTransform attributeName="transform" type="rotate" from="0 834 160" to="360 834 160" dur="20s" repeatCount="indefinite"/>
 </circle>
 <path d="M834 54l33 30m73 77-28 41m-78 64-37-30m-68-76 30-43" stroke="#a78bfa" stroke-width="1" opacity=".8"/>
