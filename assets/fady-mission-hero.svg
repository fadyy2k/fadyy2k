 <circle cx="752" cy="89" r="5" fill="#b2ff73" stroke="none" filter="url(#glow)"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="923" cy="102" r="5" fill="#49d9fc" stroke="none" filter="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="744" cy="232" r="5" fill="#a981ff" stroke="none" filter="url(#glow)"/>
 <circle cx="922" cy="227" r="5" fill="#b2ff73" stroke="none" filter="url(#glow)"/>
</g>
<text x="834" y="169" font-family="Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#e8e9ff">FZ</text>
<g font-family="Consolas, monospace" font-size="10" letter-spacing="2">
  <text x="36" y="35" fill="#bbff72">● SYSTEM ONLINE</text>
  <text x="420" y="35" fill="#626b9c">PORTFOLIO / HUMAN + TECH</text>
  <text x="792" y="36" fill="#a990ff">MISSION CONTROL / 01</text>
  <text x="749" y="79" fill="#b2ff73">BUILD</text>
  <text x="924" y="90" fill="#55dfff">SECURE</text>
  <text x="690" y="246" fill="#a990ff">OPERATE</text>
  <text x="925" y="244" fill="#b2ff73">REPEAT</text>
  <text x="38" y="303" fill="#7e86b9">BASED IN CAIRO</text>
  <text x="284" y="303" fill="#7e86b9">INFRASTRUCTURE / SECURITY / DEVSECOPS</text>
  <text x="1009" y="303" fill="#b2ff73">2026</text>
</g>
<text x="36" y="125" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="900" letter-spacing="-3" fill="url(#type)">FADY</text>
<text x="36" y="194" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="900" letter-spacing="-3" fill="url(#type)">ZAGHLOUL<tspan fill="#b2ff73">.</tspan></text>
<path d="M38 212H394" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
<text x="38" y="242" font-family="Consolas,monospace" font-size="13.6" fill="#c7d4f5">IT + SECURITY MANAGER  <tspan fill="#ba8bff">//</tspan>  PLATFORM BUILDER</text>
<text x="38" y="263" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#8c9dbf" letter-spacing=".5">Turning complicated systems into calm operations.</text>
<rect x=".75" y=".75" width="1078.5" height="326.5" rx="19" fill="none" stroke="#715cc4" stroke-width="1.5" opacity=".65"/>
