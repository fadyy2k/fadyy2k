<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
<title id="title">The Engine Room — Fady's platform engineering mission</title>
<desc id="desc">A dark, futuristic neon mission-control panel with four engineering pillars: Platform, Automation, Observability and Resilience.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1231"/>
    <stop offset=".57" stop-color="#0c1029"/>
    <stop offset="1" stop-color="#17112f"/>
  </linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f5f3ff"/>
    <stop offset=".58" stop-color="#e5ddff"/>
    <stop offset="1" stop-color="#8fe5ff"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ae7bfa"/>
    <stop offset=".54" stop-color="#42d4f7"/>
    <stop offset="1" stop-color="#b7ff83"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#8950ee" stop-opacity=".26"/><stop offset="1" stop-color="#8950ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M25 0H0V25" fill="none" stroke="#8998cf" stroke-width=".6" opacity=".18"/>
  </pattern>
  <filter id="dotglow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1078" height="338" rx="19" fill="url(#background)" stroke="#5f529c" stroke-width="1.5"/>
<rect x="15" y="14" width="1050" height="312" rx="14" fill="url(#grid)" opacity=".5"/>
<circle cx="947" cy="53" r="200" fill="url(#glow)"/>
<path d="M25 51H1055M25 307H1055" fill="none" stroke="#34345f" stroke-width="1"/>
<path d="M25 51H280M800 307H1055" fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round"/>
<g font-family="Consolas,Menlo,monospace">
  <circle cx="38" cy="29" r="3.5" fill="#b9ff8d" filter="url(#dotglow)">
    <animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="33" font-size="10" letter-spacing="1.6" fill="#baff91">SYSTEM CORE / ONLINE</text>
  <text x="800" y="33" font-size="10" letter-spacing="1.5" fill="#ab91f1">MISSION CONTROL / 02</text>
  <text x="36" y="323" font-size="9.5" letter-spacing="1.4" fill="#7785b3">FROM THE ENGINE ROOM, NOT THE SIDELINES</text>
  <text x="887" y="323" font-size="9.5" letter-spacing="1.1" fill="#b6fb92">KEEP BUILDING &gt;</text>
</g>

<!-- A personal, memorable headline that completes the hero's mission-control theme. -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="35" y="118" font-size="55" font-weight="900" letter-spacing="-2" fill="url(#headline)">THE ENGINE</text>
  <text x="35" y="180" font-size="65" font-weight="900" letter-spacing="-2.2" fill="url(#headline)">ROOM<tspan fill="#b8ff89">.</tspan></text>
  <path d="M38 195H427" stroke="url(#neon)" stroke-width="3.5" stroke-linecap="round"/>
  <text x="38" y="225" fill="#e1e4f4" font-size="16" font-weight="700">Where I build the systems</text>
  <text x="38" y="249" fill="#e1e4f4" font-size="16" font-weight="700">that keep everything running.</text>
  <text x="38" y="286" fill="#8997be" font-family="Consolas,Menlo,monospace" font-size="10.7" letter-spacing=".6">PLATFORM TO PRODUCTION / 24x7 MINDSET</text>
</g>

<!-- A matching pair of two-by-two dark neon panels. -->
<g font-family="Arial,Helvetica,sans-serif">
  <!-- PLATFORM: a connected infrastructure graph -->
  <g transform="translate(563 65)">
    <rect width="224" height="104" rx="12" fill="#161332" stroke="#9576e8" stroke-width="1.5"/>
    <path d="M12 15H62" stroke="#a685ff" stroke-width="2" stroke-linecap="round"/>
    <g fill="#1d1940" stroke="#b398ff" stroke-width="1.8">
      <rect x="24" y="35" width="16" height="16" rx="3"/>
      <rect x="48" y="60" width="16" height="16" rx="3"/>
      <rect x="12" y="65" width="16" height="16" rx="3"/>
      <path d="M32 51v10l24 0M32 62H20v3" fill="none"/>
    </g>
    <text x="90" y="47" fill="#eeeaff" font-size="16.7" font-weight="900" letter-spacing=".35">PLATFORM</text>
    <text x="90" y="65" fill="#a89bda" font-family="Consolas,monospace" font-size="10.2">DESIGN + SCALE</text>
    <text x="16" y="91" fill="#8e80c1" font-family="Consolas,monospace" font-size="9.2" letter-spacing=".4">FOUNDATIONS THAT LAST</text>
  </g>
  <!-- AUTOMATION: code brackets with orbital arrow -->
  <g transform="translate(808 65)">
    <rect width="224" height="104" rx="12" fill="#102c3b" stroke="#46c7ee" stroke-width="1.5"/>
    <path d="M12 15H62" stroke="#54d7f4" stroke-width="2" stroke-linecap="round"/>
    <g fill="none" stroke="#5ae1ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 43L21 54l12 11M52 43l12 11-12 11M48 38L38 71"/>
      <path d="M66 30c8 5 13 13 13 23M79 53l-6-7M79 53l6-6" stroke-width="1.8"/>
    </g>
    <text x="87" y="47" fill="#ddfaff" font-size="16.3" font-weight="900" letter-spacing=".1">AUTOMATION</text>
    <text x="87" y="65" fill="#86ccdf" font-family="Consolas,monospace" font-size="10.2">REPEAT, RELIABLY</text>
    <text x="16" y="91" fill="#70b2c8" font-family="Consolas,monospace" font-size="9.2" letter-spacing=".4">LESS TOIL / MORE FLOW</text>
  </g>
  <!-- OBSERVABILITY: live waveform and lens -->
  <g transform="translate(563 182)">
    <rect width="224" height="104" rx="12" fill="#141b42" stroke="#7d93f7" stroke-width="1.5"/>
    <path d="M12 15H62" stroke="#92a0fb" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#8fa9ff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 58h11l7-14 10 27 9-18 7 5h11"/>
      <circle cx="56" cy="36" r="9" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M62 42l7 8" stroke-width="1.5"/>
    </g>
    <text x="86" y="47" fill="#e8edff" font-size="13.8" font-weight="900" letter-spacing="-.15">OBSERVABILITY</text>
    <text x="86" y="65" fill="#a5b5ea" font-family="Consolas,monospace" font-size="10.2">SIGNALS, NOT NOISE</text>
    <text x="16" y="91" fill="#899ace" font-family="Consolas,monospace" font-size="9.2" letter-spacing=".4">KNOW BEFORE YOU GUESS</text>
  </g>
  <!-- RESILIENCE: recovery ring and check -->
  <g transform="translate(808 182)">
    <rect width="224" height="104" rx="12" fill="#152c2b" stroke="#a6e17d" stroke-width="1.5"/>
    <path d="M12 15H62" stroke="#b1f388" stroke-width="2" stroke-linecap="round"/>
    <g fill="none" stroke="#b6fb8e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M67 49a24 24 0 1 0 2 20M69 35v17H52"/>
      <path d="M30 54l11 10 21-22" stroke-width="2.1"/>
    </g>
    <text x="87" y="47" fill="#ecffdf" font-size="16.3" font-weight="900">RESILIENCE</text>
    <text x="87" y="65" fill="#b6daa2" font-family="Consolas,monospace" font-size="10.2">READY TO RECOVER</text>
    <text x="16" y="91" fill="#98c088" font-family="Consolas,monospace" font-size="9.2" letter-spacing=".4">FAIL / LEARN / IMPROVE</text>
  </g>
</g>
</svg>