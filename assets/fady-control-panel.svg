<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="235" viewBox="0 0 1080 235" role="img" aria-labelledby="title desc">
<title id="title">How my brain works — animated operating system</title>
<desc id="desc">Three dark navy neon animated modules: BUILD for architecture, SECURE for identity and policy, RECOVER for operational reliability.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1233"/><stop offset=".56" stop-color="#090D22"/><stop offset="1" stop-color="#11102B"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#AD6BFF"/><stop offset=".55" stop-color="#32D7FB"/><stop offset="1" stop-color="#BBFF72"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8097ff" stroke-width=".6" opacity=".12"/></pattern>
</defs>
<rect x="1" y="1" width="1078" height="233" rx="18" fill="url(#bg)" stroke="#6256a0" stroke-width="1.4"/>
<rect x="4" y="4" width="1072" height="226" rx="16" fill="url(#grid)"/>
<circle cx="29" cy="23" r="3.2" fill="#B7FF8A"><animate attributeName="opacity" values="1;.35;1" dur="3.4s" repeatCount="indefinite"/></circle>
